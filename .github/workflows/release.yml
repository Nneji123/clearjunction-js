name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the notes and print them without tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # release-notes.mjs reads the tag list and the full commit range.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --coverage

      - name: Build
        run: npx tsup

      - name: Build release notes
        id: notes
        run: node .github/release-notes.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Print release notes
        run: cat "${{ steps.notes.outputs.notes_file }}"

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::Dry run. Would release ${{ steps.notes.outputs.tag }}; nothing tagged or published."
          exit 0

      - name: Sync package.json to the computed version
        if: ${{ !inputs.dry_run }}
        run: npm version "${{ steps.notes.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Prepend the notes to CHANGELOG.md
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          {
            echo "# Changelog"
            echo
            echo "## $TAG"
            echo
            cat "$NOTES_FILE"
            echo
            if [ -f CHANGELOG.md ]; then
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG.next.md
          mv CHANGELOG.next.md CHANGELOG.md

      - name: Commit the version bump and changelog
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          git config user.name "nneji123"
          git config user.email "101701760+Nneji123@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git push origin HEAD:${{ github.ref_name }}

      # Publish before minting the tag: a registry failure then leaves no tag or
      # release pointing at a version that was never published, and the run can
      # simply be retried.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Tag and publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
